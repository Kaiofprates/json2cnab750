    Pix:
      type: "object"
      title: "Pix"
      required: ["endToEndId", "valor", "horario"]
      properties:
        endToEndId:
          $ref: "#/components/schemas/EndToEndId"
        txid:
          allOf:
            - $ref: "#/components/schemas/TxId"
            - pattern: "[a-zA-Z0-9]{1,35}"
        valor:
          type: "string"
          title: "Valor do Pix."
          pattern: "\\d{1,10}\\.\\d{2}"
          description: "Valor do Pix."
        componentesValor:
          type: "object"
          title: "InformaÃ§Ãµes sobre o valor do Pix"
          description: |-
            O objetivo dessa estrutura Ã© explicar os elementos de composiÃ§Ã£o do valor do Pix, incluindo informaÃ§Ãµes sobre as multas, juros, descontos e abatimentos quando o Pix for relativo a cobranÃ§as com vencimento.

            Regras da estrutura:
            - O `valor` do Pix Ã© igual a: 
              - (`original.valor` + `saque.valor` + `troco.valor`) + `multa.valor` + `juros.valor` â€“ `abatimento.valor` â€“ `desconto.valor`
              considerando-se apenas os campos que estiverem presentes para cada tipo de cobranÃ§a pago.
            - As estruturas `saque` e `troco` sÃ³ serÃ£o retornadas quando o Pix for relativo a um Pix Saque ou Pix Troco, respectivamente, e 
            as demais estruturas (`juros`, `multa`, `abatimento` e `desconto`) sÃ³ serÃ£o pertinentes aos Pix de pagamentos das cobranÃ§as com vencimento.
            - NÃ£o pode haver simultaneamente uma subsestrutura do tipo `saque` e outra do tipo `troco`;
            - NÃ£o hÃ¡ restriÃ§Ã£o na ordem das subestruturas.

            Para o caso de um Pix Saque pode-se retornar `original` com valor=0.00 (zero) uma vez que a soma serÃ¡ respeitada, ou pode-se omitir a 
            subestrutura original. No caso de um Pix Troco ou de um pagamento de cobranÃ§a com vencimento a subsestrutura `original` vai sempre estar 
            presente.

            #### Exemplos vÃ¡lidos:
            Exemplo de preenchimentos vÃ¡lidos. 

            - **Pix para pagamento de cobranÃ§a imediata (sem saque ou troco).**
              ```
              ...
              "componentesValor": {
                "original": {
                  "valor": "100.00"
                } 
              }
              ...
              ```
            - **Pix Saque.**
              ```
              ...
              "componentesValor": {
                "saque": {
                  "valor": "100.00",
                  "modalidadeAgente": "AGPSS",
                  "prestadorDeServicoDeSaque": "12345678"
                } 
              }
              ...
              ```
            - **Pix para pagamento de cobranÃ§a imediata com saque (pode vir original.valor=0.00).**
              ```
              ...
              "componentesValor": {
                "original": {
                  "valor": "0.00"
                },
                "saque": {
                  "valor": "100.00",
                  "modalidadeAgente": "AGPSS",
                  "prestadorDeServicoDeSaque": "12345678"
                } 
              }
              ...
              ```
            - **Pix Troco.**
              ```
              ...
              "componentesValor": {
                "original": {
                  "valor": "80.00"
                },
                "troco": {
                  "valor": "20.00",
                  "modalidadeAgente": "AGTEC",
                  "prestadorDeServicoDeSaque": "12345678"
                } 
              }
              ...
              ```
            - **Pix para pagamento de cobranÃ§a imediata com troco (ordem nÃ£o importa).**
              ```
              ...
              "componentesValor": {
                "troco": {
                  "valor": "20.00",
                  "modalidadeAgente": "AGTEC",
                  "prestadorDeServicoDeSaque": "12345678"
                },
                "original": {
                  "valor": "80.00"
                }
              }
              ...
              ```
            - **Pix para pagamento de cobranÃ§a com vencimento de R$100,00 considerando-se um atraso de 2 dias a uma multa de 3% e juros de 1% ao dia. O `valor` do Pix serÃ¡ R$105,00.**
              ```
              ...
              "componentesValor": {
                "original": {
                  "valor": "100.00"
                },
                "multa": {
                  "valor": "3.00"
                },
                "juros": {
                  "valor": "2.00"
                }
              }
              ...
              ```            
            #### Exemplos invÃ¡lidos:
            Exemplos, nÃ£o exaustivos, de preenchimentos invÃ¡lidos.
            - **`original.valor` maior que 0.00 (zero) e `saque` juntos**
              ```
              ...
              "componentesValor": {
                "original": {
                  "valor": "80.00"
                },
                "saque": {
                  "valor": "20.00",
                  "modalidadeAgente": "AGPSS",
                  "prestadorDeServicoDeSaque": "12345678"
                } 
              }
              ...
              ```
            - **dois elementos de `saque`**
              ```
              ...
              "componentesValor": [
                "saque": {
                  "valor": "20.00",
                  "modalidadeAgente": "AGPSS",
                  "prestadorDeServicoDeSaque": "12345678"
                },
                "saque": {
                  "valor": "10.00",
                  "modalidadeAgente": "AGPSS",
                  "prestadorDeServicoDeSaque": "12345678"
                } 
              ]
              ...
              ```
            - **saque e troco simultaneamente**
              ```
              ...
              "componentesValor": {
                "original": {
                  "valor": "60.00"
                },
                "saque": {
                  "valor": "20.00",
                  "modalidadeAgente": "AGPSS",
                  "prestadorDeServicoDeSaque": "12345678"
                },
                "troco": {
                  "valor": "20.00",
                  "modalidadeAgente": "AGTEC",
                  "prestadorDeServicoDeSaque": "12345678"
                } 
              }
              ...
              ```
          anyOf:
            - $ref: "#/components/schemas/PixValorOriginal"
            - $ref: "#/components/schemas/PixValorSaque"
            - $ref: "#/components/schemas/PixValorTroco"
            - $ref: "#/components/schemas/PixValorJuros"
            - $ref: "#/components/schemas/PixValorMulta"
            - $ref: "#/components/schemas/PixValorAbatimento"
