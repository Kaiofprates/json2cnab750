# Nginx — proxy reverso para a API JSON2CNAB750.
# Instalado por deploy/deploy.sh em /etc/nginx/sites-available/json2cnab750
# (com __SERVER_NAME__ substituído pelo domínio informado).
#
# O frontend é servido pela própria FastAPI; o Nginx apenas faz o proxy e,
# opcionalmente, entrega os assets estáticos direto do disco (mais rápido).

upstream json2cnab750_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Uploads de arquivos de retorno podem ser grandes.
    client_max_body_size 1024M;

    # Timeouts folgados para processar arquivos grandes.
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # Logs
    access_log /var/log/nginx/json2cnab750.access.log;
    error_log  /var/log/nginx/json2cnab750.error.log;

    # (Opcional) Servir assets estáticos direto do disco.
    # Descomente e ajuste o caminho se quiser tirar essa carga do backend.
    # location /static/ {
    #     alias __APP_DIR__/frontend/;
    #     expires 7d;
    #     access_log off;
    # }

    location / {
        proxy_pass http://json2cnab750_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

# Após validar em HTTP, ative o HTTPS com:
#   sudo certbot --nginx -d __SERVER_NAME__
# O Certbot reescreve este server{} para escutar em 443 com o certificado
# Let's Encrypt e cria o redirecionamento 80 -> 443 automaticamente.
